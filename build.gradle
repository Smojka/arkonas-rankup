plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.0.0-beta8'
    id 'io.freefair.lombok' version '8.12.1'
}

group 'com.arkonas'
version '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
    maven { url 'https://repo.papermc.io/repository/maven-public/' }
    maven { url 'https://repo.extendedclip.com/content/repositories/placeholderapi/' }
    maven { url 'https://nexus.bencodez.com/repository/maven-public/' }
    maven { url 'https://jitpack.io' }
    maven { url 'https://nexus.neetgames.com/repository/maven-releases/' }
}

dependencies {
    testImplementation 'org.junit.platform:junit-platform-launcher:1.8.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-engine:5.8.2'
    testImplementation 'com.github.MockBukkit:MockBukkit:v1.21-SNAPSHOT'
    testImplementation 'io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT'
    testImplementation 'com.github.TownyAdvanced.Towny:towny:d71ad25'

    compileOnly 'org.jetbrains:annotations:22.0.0'
    compileOnly 'io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT'

    compileOnly('com.github.MilkBowl:VaultAPI:1.7') {
        exclude group: 'org.bukkit'
    }
    compileOnly 'net.luckperms:api:5.4'
    compileOnly('me.clip:placeholderapi:2.10.9') {
        exclude group: 'org.bstats'
    }
    compileOnly('com.gmail.nossr50.mcMMO:mcMMO:2.2.004') {
        exclude group: 'com.sk89q.worldguard'
    }
    compileOnly 'com.github.pyvesb:advanced-achievements:8.0.2'
    compileOnly 'com.github.astei:Superbvote:700fca43659b438cb9bb36c218a7646d2f2ef315'
    compileOnly('com.bencodez:votingplugin:6.14.1') {
        transitive = false
    }
    compileOnly 'com.github.TownyAdvanced.Towny:towny:d71ad25'
    compileOnly('com.github.Realizedd:TokenManager:3.2.4') {
        transitive = false
    }

    implementation('io.pebbletemplates:pebble:3.1.5') {
        exclude group: 'org.slf4j'
    }
    implementation 'com.electronwill.night-config:toml:3.6.4'
    implementation 'org.slf4j:slf4j-nop:1.7.30'
    implementation 'org.slf4j:slf4j-api:1.7.30'
    implementation 'com.zaxxer:HikariCP:5.1.0'
    implementation 'org.xerial:sqlite-jdbc:3.46.1.3'
    implementation 'org.mariadb.jdbc:mariadb-java-client:3.5.1'
}

artifacts {
    archives shadowJar
}

shadowJar {
    archiveClassifier.set('')
    minimize {
        exclude(dependency('org.xerial:sqlite-jdbc:.*'))
        exclude(dependency('org.mariadb.jdbc:mariadb-java-client:.*'))
    }
    relocate 'org.slf4j', 'com.arkonas.ranks.libs.org.slf4j'
    relocate 'io.pebbletemplates', 'com.arkonas.ranks.libs.io.pebbletemplates'
    relocate 'com.mitchellbosecke', 'com.arkonas.ranks.libs.com.mitchellbosecke'
    relocate 'com.electronwill', 'com.arkonas.ranks.libs.com.electronwill'
    relocate 'com.zaxxer.hikari', 'com.arkonas.ranks.libs.com.zaxxer.hikari'
    relocate 'org.mariadb', 'com.arkonas.ranks.libs.org.mariadb'
}

processResources {
    inputs.property 'version', project.version
    duplicatesStrategy = 'include'

    from(sourceSets.main.resources.srcDirs) {
        include 'plugin.yml'
        expand 'version': project.version
    }

    from(sourceSets.main.resources.srcDirs) {
        exclude 'plugin.yml'
    }
}

test {
    useJUnitPlatform()
    systemProperty 'RANKUP_TEST', 'true'
    testLogging {
        events "passed", "skipped", "failed"
    }
}
