# this is used for letting you know that you need to update/change your config file
version: 10

# the locale to use for messages
# all messages can be customised but this allows you to
# choose messages that are already translated
# locales can be found in the locale/ folder
locale: en

# interval (in minutes) to check to autorankup players
# ranking up manually will always be enabled
# set to 0 to disable
autorankup-interval: 0

# which economy the 'money' requirement uses.
#   auto          - prefer Vault, else the first available backend (default)
#   vault         - Vault (works with EssentialsX, CMI, and most economy plugins)
#   playerpoints  - PlayerPoints
#   coinsengine:<currency> - a named CoinsEngine currency, e.g. coinsengine:gold
# unknown or unavailable backends fall back to auto-detect.
economy:
  provider: auto

# what the auto task does each pass (only runs when autorankup-interval > 0).
# players still need the rankup.auto permission.
auto:
  # automatically rank players up
  rankup: true
  # automatically prestige players who are at the top rank (needs prestige: true)
  prestige: true
  # rank up repeatedly in a single pass until the player can no longer afford it
  # (false = advance at most one rank per pass, the classic behaviour)
  max: false

# whether /ranks and /prestiges should be enabled (true) or disabled (false)
# /rankup3 reload will not do anything if this is changed,
# you will have to restart your server.
ranks: true
# you can alternatively negate the permission rankup.prestiges
# this will also make the command not autocomplete in 1.13
prestiges: true

# whether to enable the /ranks GUI.
# will override the /ranks command
ranks-gui: false

# whether /prestige and /prestiges should be enabled.
# when a player reaches the top rank, they can do /prestige to return to the first rank,
# but you will be able to grant them an additional "prestige" group or additional items.
#
# if you do not want this command to autocomplete, make sure
# you negate the permission rankup.prestige with your permissions plugin.
# if enabled, a prestiges.yml file will be generated with some example prestiges
# You must restart your server when you change this for it to work!
prestige: false

# if true, players with the permission rankup.notify will receive notifications when they join
# to update if the server is on an older version of Rankup.
notify-update: true

# if rankups and prestiges should be by permissions
#   if false, players will be checked for if they have a group of the same name as in rankups.yml,
# and automatically added and taken away from those groups.
#   if true, players will be checked for the permission rankup.rank.RANK, where RANK
# is the rankup in rankups.yml. Nothing will automatically happen on rankup, so you must
# use commands to change a player's group or permission.
# THIS IS MORE DIFFICULT TO USE. DO NOT ENABLE THIS UNLESS YOU ARE HAPPY TO ACKNOWLEDGE THAT IT MAKES MORE WORK FOR YOU.
# By default, Rankup will automatically change groups when someone ranks up, using your permissions plugin.
# You only need to enable this if you really need the flexibility.
permission-rankup: false

# if not empty, these are the contexts to use when modifying groups if LuckPerms is enabled
# if empty, this will be based on your LuckPerms config.yml 'use-vault-server' and 'vault-server'
# this option will only if permission-rankup is disabled
#
# luckperms-context: 'server=global' # to make all rankups global
# luckperms-context: 'server=survival' # to make all rankups specific to survival
# luckperms-context: 'server=survival world=world_nether' # to make all rankups specific to the nether world in survival
luckperms-context: ''

# enable this option if you want Rankup to use the names of LuckPerms group, rather than their display names
use-luckperms-group-names: false

# if players can use /rankup noconfirm to bypass any confirmation
# the permission rankup.noconfirm is used for this command, but it is true by default
# the console can always do /rankup noconfirm <player>
enable-noconfirm: true

# how people should confirm ranking up
# options are: gui, text or none
confirmation-type: 'gui'

# how long, in seconds, people have to wait between a successful /rankup or /prestige
# set to 0 to disable.
cooldown: 1

# if enabled, players can run /maxrankup to rankup as many times as possible,
# before they fail the requirements for the next rank.
# the permission rankup.maxrankup is used for this command, but it is given by default.
# note that /maxrankup, if enabled, has no confirmation.
max-rankup:
  # You must restart your server if you enable or disable /maxrankup!
  enabled: false
  # whether to send a message for each rankup a player does
  # if set to true, the chat may be spammed for each rankup a player goes through with /maxrankup
  # if set to false, only the last rankup will be shown (if a player starts on rank A, then does
  # /maxrankup and ranks up to B and then C, it will just say "player has ranked up to C")
  individual-messages: true

# options when using the text rankup confirmation
text:
  # the time in seconds for a player to
  # confirm by typing /rankup again
  timeout: 10

# placeholders:
# https://okx.sh/rankup/Placeholders.html
placeholders:
  # format for money. for more information, see
  # https://docs.oracle.com/javase/8/docs/api/java/text/DecimalFormat.html
  money-format: "#,##0.##"
  percent-format: "0.##"
  # the format used for requirements
  simple-format: "#.##"
  # used for current_rank and next_rank placeholders when a player is not in anything in rankups.yml
  not-in-ladder: "None"
  # used in the current_prestige placeholders when a player hasn't prestiged yet
  no-prestige: "None"
  # used in the next_rank and next_prestige placeholders when a player is at the highest rank or prestige
  highest-rank: "None"
  # used in the %rankup_status_[rank]% placeholders
  status:
    complete: "Complete"
    current: "Current"
    incomplete: "Incomplete"
  last-rank-display-name: "last rank"

# what to shorten money by.
# ie 1000 -> 1k
# set to an empty list to disable
# for each entry here, it counts as increasing by a factor of 1,000
# the first represents thousands (1,000) then millions (1,000,000) then billions (1,000,000,000) etc.
# this is used in the "| shortmoney" filter
shorten:
- 'K'
- 'M'
- 'B'
- 'T'
- 'Q'
- 'Qu'
- 'S'

# how messages are rendered:
# auto - legacy & codes, &#RRGGBB hex and MiniMessage tags can be mixed (default)
# legacy - only & codes and &#RRGGBB, exactly like Rankup3
# minimessage - only MiniMessage tags
message-format: auto

# rankup/prestige statistics and leaderboards (/rankup top and
# %rankup_top_<n>_name% style placeholders)
database:
  enabled: true
  # sqlite (default, stored in plugins/ArkonasRanks/data.db) or mysql
  type: sqlite
  host: localhost
  port: 3306
  database: arkonasranks
  username: root
  password: ''
  pool-size: 4

# Advanced menu module (GUI overhaul).
# When enabled, /rankup, /ranks, /prestige, /prestiges and /rankup top open
# animated pop-up inventory menus instead of writing to chat, and the menu
# becomes the confirmation screen (ranks-gui and confirmation-type are ignored).
# The console, /rankup noconfirm and players not in any ladder keep the exact
# Rankup3-parity behaviour. Set to false for full parity. Menu appearance is
# configured in menus.yml.
menus:
  enabled: true

# Cost formula (optional). Instead of hand-writing a requirement on every rank,
# generate one from a formula based on the rank's position in the ladder.
# Ranks that already declare the requirement keep their explicit value unless
# override is true. Ranks using prestige-style requirement maps are never touched.
# Variables available in the expression:
#   {index} - 0-based position of the rank in the ladder (first rank = 0)
#   {n}     - total number of ranks in the ladder
#   {prev}  - the cost generated for the previous rank (0 for the first)
# Operators: + - * / % ^   Functions: min max pow floor ceil round abs sqrt
cost-formula:
  enabled: false
  # the requirement name to generate (money, xp-level, tokenmanager-tokens, ...)
  requirement: money
  # e.g. exponential scaling: first rank 1000, each rank 15% dearer
  expression: "1000 * 1.15 ^ {index}"
  # decimal places to round to (-1 to disable rounding)
  round: 2
  # true = replace an explicit requirement of the same name; false = only fill ranks without one
  override: false

# Multiple ladders (optional). rankups.yml is always the "default" ladder. To add
# parallel ladders a player progresses on independently (e.g. a mining track and a
# combat track), drop extra files in a `ladders/` folder next to this config, one
# file per ladder using the same format as rankups.yml (yaml or toml). The file name
# is the ladder id. Players use `/rankup <ladder>` and `/maxrankup <ladder>`; auto
# rankup advances every ladder. `/rankup` with no argument, the menu and prestige all
# stay on the default ladder.
# A ladder may have its own cost formula here; otherwise the global cost-formula above
# is used:
# ladders:
#   mining:
#     cost-formula:
#       enabled: true
#       requirement: money
#       expression: "500 * 1.2 ^ {index}"
#       round: 2
#       override: false

# Rebirth (optional). A progression tier above rankup/prestige: a player who has
# reached the top can "be reborn", advancing through the rebirth groups below and
# resetting back to the first rank, in exchange for requirements and reward commands.
# Commands: /rebirth and /rebirths (permission rankup.rebirth). Disabled by default.
rebirth:
  enabled: false
  # what must be maxed before a rebirth is allowed: top-rank or top-prestige
  requires: top-rank
  # the ordered rebirth permission groups; players advance one per rebirth
  groups:
    - rebirth1
    - rebirth2
    - rebirth3
  # send the player back to the first rank group after a rebirth
  reset-ranks: true
  # requirements to be reborn (same syntax as rank requirements)
  requirements:
    - 'money 1000000'
  # console commands run on rebirth ({player} and {rebirth} are replaced)
  commands: []
  # messages ({player}/{rebirth} placeholders, & colour codes)
  messages:
    success: '&aYou have been reborn as &e{rebirth}&a!'
    requirements-not-met: '&cYou do not meet the requirements to be reborn.'
    not-at-top: '&cYou must reach the top of your progression before you can be reborn.'
    maxed: '&cYou have reached the maximum rebirth.'

# Cost multipliers (optional). Scales the money requirement of every rankup.
# A factor below 1 is a discount, above 1 a surcharge. The effective factor is
# global * (best permission factor the player has) * (active event booster).
# Placeholders and menus reflect the discounted cost, and the deduction matches.
multipliers:
  global: 1.0
  # permission node -> factor; the player's lowest matching factor (best discount) wins
  permissions:
    rankup.multiplier.vip: 0.9
    rankup.multiplier.mvp: 0.8

# Always-on progress display toward the next rank (optional). Placeholders in the
# text: %percent%, %rank%, %next%, %player%. Toggling this needs a server restart.
# The exp-bar mirror overwrites the vanilla XP bar fill (not the level).
progress-display:
  enabled: false
  interval-ticks: 20
  expbar: false
  bossbar:
    enabled: false
    text: '&aNext: %next% &7- &e%percent%%'
    color: GREEN      # PINK BLUE RED GREEN YELLOW PURPLE WHITE
    overlay: PROGRESS # PROGRESS NOTCHED_6 NOTCHED_10 NOTCHED_12 NOTCHED_20
  actionbar:
    enabled: false
    text: '&7Progress to %next%: &e%percent%%'
