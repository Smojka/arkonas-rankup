  #- 'eco give {{player}} 5000'
  #- 'broadcast &d{{player}} reached their first prestige!'
P1example:
  from: 'D'
  to: 'A'
  # the rank added to indicate this prestige
  rank: 'P1'
  next: 'P2'
  requirements:
    - 'money 20000'
    - 'xp-level 5'
