# bu bölümdeki mesajlar rankups.yml içinde her rütbe için ayrı ayrı özelleştirilebilir.
rankup:
  requirements-not-met: "&cRütbe atlamak için {{rank.requirement('money').total | money}} paraya ihtiyacın var."
  no-rankup: "&eEn yüksek rütbedesin."
  # bir mesajı gizlemek için boş string yap, örn: success-public: ""
  success-public: "&a{{player}} &eyeni rütbesine yükseldi: &d{{next.rank}}"
  success-private: "&aYeni rütbene yükseldin: &d{{next.rank}}"
  # yazılı onay için kullanılır
  confirmation: |-
    &e&a{{next.rank}} &erütbesine yükselmek istediğine emin misin?
    &eOnaylamak için tekrar &c/rankup &eyaz.
  must-prestige: "&cDaha fazla /rankup için önce prestij yapmalısın!"

  gui:
    rows: 1
    title: "Rütbe atla: {{next.rank}}"
    rankup:
      material: EMERALD_BLOCK
      # index boşlukla ayrılarak birden çok grupta gösterilebilir
      # örnek: 0-3 9-12 18-21
      # aralık yerine tek bir sayı da kullanabilirsin.
      index: 0-3
      name: '&a&lOnayla'
      # lore isteğe bağlıdır
      lore: '&6Yeni rütbe: &b{{next.rank}}'
    cancel:
      material: REDSTONE_BLOCK
      index: 5-8
      name: '&c&lİptal'
    fill:
      name: ' '
      # 1.8-1.12 kullanıyorsan MATERIAL:data yazabilirsin, örnek STAINED_GLASS_PANE:8
      # bu rankup ve cancel blokları için de geçerlidir
      material: BLACK_STAINED_GLASS_PANE

  ranksgui:
    title: "Rütbeler"
    rows: 3
    offset: 10
    width: 7
    complete:
      material: GREEN_STAINED_GLASS_PANE
      name: "&aRütbe &7{{next.rank}} &a(tamamlandı)"
    current:
      material: ORANGE_STAINED_GLASS_PANE
      name: "&dRütbe atla: &7{{next.rank}}"
    incomplete:
      material: RED_STAINED_GLASS_PANE
      name: "&cRütbe &7{{next.rank}} &c(rütbe atlaman gerekli)"
    fill:
      material: BLACK_STAINED_GLASS_PANE
      name: ' '

  # bu mesajları rankups.yml içinde her rütbe için ayrı özelleştirmen önerilir.
  list:
    complete: "&7{{rank.rank}} &8\xbb &7{{next.rank}}"
    current: "&c{{rank.rank}} &e\xbb &c{{next.rank}}"
    incomplete: "&r{{rank.rank}} &e\xbb &r{{next.rank}}"
    # boş string header/footer'ı devre dışı bırakır
    header: ""
    footer: ""
  # bekleme süresi dolmadan rankup denenince gönderilir
  cooldown:
    singular: "&cTekrar rütbe atlamak için {{seconds_left}} saniye daha beklemelisin."
    plural: "&cTekrar rütbe atlamak için {{seconds_left}} saniye daha beklemelisin."
# prestij mesajları da özelleştirilebilir
prestige:
  requirements-not-met: "&cPrestij yapmak için {{rank.requirement('money').total | money}} paraya ihtiyacın var."
  no-prestige: "&eEn yüksek prestijdesin."

  success-public: "&a{{player}} &eprestij yaptı: &d{{next.rank}}"
  success-private: "&aPrestij yaptın: &d{{next.rank}}"

  confirmation: |-
    &e&a{{next.rank}} &eprestijine geçmek istediğine emin misin?
    &eOnaylamak için tekrar &c/prestige &eyaz.

  gui:
    title: "Prestij: {{next.rank}}"
    rankup:
      material: GOLD_BLOCK
      index: 0-3
      name: '&a&lOnayla'
      lore: '&6Prestij: &b{{next.rank}}'
    cancel:
      material: REDSTONE_BLOCK
      index: 5-8
      name: '&c&lİptal'
    fill:
      name: ' '
      material: BLACK_STAINED_GLASS_PANE

  list:
    complete: "&7{{rank.rank}} &8\xbb &7{{next.rank}}"
    current: "&c{{rank.rank}} &e\xbb &c{{next.rank}}"
    incomplete: "&r{{rank.rank}} &e\xbb &r{{next.rank}}"
    header: ""
    footer: ""
  cooldown:
    singular: "&cTekrar prestij yapmak için {{seconds_left}} saniye beklemelisin."
    plural: "&cTekrar prestij yapmak için {{seconds_left}} saniye daha beklemelisin."

not-high-enough: "&cBu rütbede prestij yapamazsın!"
not-in-ladder: "&cÜzgünüz, bulunduğun grup(lar) için rütbe atlama bulunamadı. Rütbeleri listelemek için /ranks kullan."

# Gelişmiş menü modülü (menus.yml). İsim/lore &kodları, &#RRGGBB hex ve
# MiniMessage etiketlerini destekler. Menüye özel {bar} {percent} {seconds}
# {page} {pages} {position} {name} {count} {player} {rank} {next} {rankups}
# tokenleri Pebble'dan önce ikame edilir; {{ ... }} normal Pebble'dır.
menu:
  common:
    back: "&7« Geri"
    home: "&b☰ Menü"
    close: "&cKapat"
    prev-page: "&a« Önceki"
    next-page: "&aSonraki »"
    page: "&7Sayfa {page}/{pages}"
  hub:
    title: "ArkonasRanks"
    head-name: "&b{player}"
    head-lore: |-
      &7Mevcut rütbe: &f{rank}
      &7Sonraki rütbe: &f{next}
      &7Rütbe atlama: &a{rankups}
    disabled: "&8Şu anda kullanılamıyor"
    buttons:
      path:
        name: "&b&lRütbe Yolu"
        lore: "&7Tüm merdiveni gör"
      rankup:
        name: "&a&lRütbe Atla"
        lore: "&7Bir sonraki rütbene yüksel"
      prestige:
        name: "&d&lPrestij"
        lore: "&7En üste ulaşınca prestij yap"
      leaderboard:
        name: "&6&lLider Tablosu"
        lore: "&7En çok rütbe & prestij"
  # Üretilen gereksinim bloğu: rütbe yolu, prestij listesi ve elle yazılmış rütbe
  # lore'undaki {requirements} etiketi bu şablonları basar.
  #
  # Etiketler: {name} {current} {required} {remaining} {percent} {bar} {status}
  #            {color} {type} {sub} {raw}
  # Her şablon tek satır ya da satır listesi olabilir; & kodları, &#RRGGBB,
  # MiniMessage, {{rank.rank}}, {{ value | money }} ve PlaceholderAPI da çalışır.
  requirements:
    # rütbenin gereksinimi varsa bloğun üstüne/altına basılan satırlar
    header: []
    footer: []
    hide-met: false
    sort: config              # config | unmet-first | met-first
    # kilitli rütbeler, yani oyuncunun henüz uğraşmadığı rütbeler
    line: "&7• &f{name}: &b{required}"
    # oyuncunun üzerinde olduğu rütbe ve onay ekranı
    line-progress: "&7• &f{name}: &b{required} &7(%{percent})"
    # line-met / line-unmet duruma göre ikisini de ezer:
    # line-unmet: "&7• &f{name}: &c{current}&7/&f{required} &7(%{percent})"
    # line-met: "&7• &f{name}: &a{required} &7(tamam)"
    # sayılacak bir şeyi olmayan gereksinimler: permission, world, group, advancement...
    line-flat: "&7• &f{name}: {status}"
    status-met: "&a✔"
    status-unmet: "&c✖"
    time-format: "{days} gün, {hours} saat, {minutes} dakika"
    formats:
      # money | shortmoney | simple | percent | raw
      # time (dakika) | time-seconds | time-hours | time-ticks
      default: simple
    # gereksinim başına ezme; her biri kendi format'ını ve yukarıdaki satırları alabilir
    types: {}
      # playtime-minutes:
      #   format: time
      #   line-progress:
      #     - "&7• &f{name}"
      #     - "  &8mevcut: &b{current}"
      #     - "  &8gerekli: &f{required} &7(%{percent})"
  path:
    title: "Rütbe Yolu"
    current: "&d{{rank.rank}} &7» &f{{next.rank}}"
    complete: "&a{{rank.rank}} &7(tamamlandı)"
    locked: "&c{{rank.rank}} &7» &f{{next.rank}}"
    click-rankup: "&eRütbe atlamak için tıkla"
  rankup:
    title: "Rütbe » {{next.rank}}"
    target: "&a&l{{next.rank}}"
    info-name: "&b&l{{ next.name | default(next.rank) }}"
    info-lore: "&7{{rank.rank}} &7’den &f{{next.rank}} &7’ye\n&r\n&e&lÖdüller:\n{rewards}"
    rewards-default: "&8• &7{{next.rank}} &7rütbesini açar"
    confirm: "&a&lRÜTBE ATLA"
    confirm-lore: "&7Tıkla ve &f{{next.rank}} &7rütbesine geç"
    # aynı düğmenin şartlar sağlanmadığındaki hâli. tek başına bir satırdaki
    # {requirements} etiketi, oyuncunun henüz tamamlamadığı şartları basar.
    locked: "&c&lŞARTLARI SAĞLAMIYORSUN"
    locked-lore: "&7Şu şartlar eksik:\n{requirements}\n&r\n&8Hepsini tamamlayınca bu düğme yeşile döner."
    cooldown: "&eLütfen &c{seconds}sn &ebekle"
    blocked: "&cŞu anda atlanacak rütbe yok"
    requirement-money: "&7Ücret: &6{{ value | money }}"
    requirement-simple: "&7Gerekli: &f{{ value | simple }}"
    requirement-progress: "&b{bar} &7%{percent}"
    requirement-met: "&a✔ Gereksinim tamam"
    requirement-unmet: "&c✖ Henüz tamamlanmadı"
    requirement-names:
      money: "Para"
      xp-level: "XP Seviyesi"
      playtime-minutes: "Oyun Süresi"
      block-break: "Kırılan Bloklar"
      mob-kills: "Yaratık Öldürme"
      player-kills: "Oyuncu Öldürme"
      item: "Eşyalar"
      craft-item: "Üretilen Eşyalar"
      advancement: "Başarım"
      group: "Grup"
      permission: "İzin"
      placeholder: "Placeholder"
      world: "Dünya"
  prestige:
    title: "Prestij » {{next.rank}}"
    target: "&d&l{{next.rank}}"
    info-name: "&d&l{{ next.name | default(next.rank) }}"
    info-lore: "&7{{rank.rank}} &7’den &f{{next.rank}} &7’ye\n&r\n&e&lÖdüller:\n{rewards}"
    rewards-default: "&8• &7{{next.rank}} &7rütbesini açar"
    confirm: "&a&lPRESTİJ YAP"
    confirm-lore: "&7Tıkla ve &f{{next.rank}} &7prestijine geç"
    locked: "&c&lŞARTLARI SAĞLAMIYORSUN"
    locked-lore: "&7Şu şartlar eksik:\n{requirements}\n&r\n&8Hepsini tamamlayınca bu düğme yeşile döner."
    cooldown: "&eLütfen &c{seconds}sn &ebekle"
    blocked: "&cHenüz prestij yapamazsın"
  prestige-list:
    title: "Prestijler"
    current: "&d{{next.rank}}"
    complete: "&a{{rank.rank}} &7(tamam)"
    locked: "&c{{next.rank}}"
    click: "&ePrestij yapmak için tıkla"
  leaderboard:
    title: "Lider Tablosu"
    entry: "&e#{position} &f{name} &7- &b{count}"
    toggle-rankups: "&a&lRütbeler &7(prestij için tıkla)"
    toggle-prestiges: "&d&lPrestijler &7(rütbe için tıkla)"
    empty: "&7Henüz kayıt yok"
    loading: "&7Yükleniyor..."
    disabled: "&cİstatistikler kapalı"
