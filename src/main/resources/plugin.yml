name: ArkonasRanks
version: "${version}"
main: com.arkonas.ranks.ArkonasRanksPlugin
author: Arkonas
description: Feature-complete rankup system with prestiges, GUIs, effects and stats.
depend: [Vault]
softdepend: [PlaceholderAPI, mcMMO, AdvancedAchievements, Towny, SuperbVote, VotingPlugin, LuckPerms, DiscordSRV]
api-version: '1.21'

commands:
  rankup:
    permission: rankup.rankup
    description: Rankup.
  arkonasranks:
    description: View ArkonasRanks version and perform some administrative commands.
    # keep Rankup3 muscle memory
    aliases: [aru, rankup3, pru]
  ranks:
    permission: rankup.ranks
    description: List all the ranks.
  prestige:
    permission: rankup.prestige
    description: Prestige.
  prestiges:
    permission: rankup.prestiges
    description: List all the prestiges.
  maxrankup:
    permission: rankup.maxrankup
    description: Rankup as much as possible.
  rebirth:
    permission: rankup.rebirth
    description: Reset your progression for a rebirth reward (if enabled).
  rebirths:
    permission: rankup.rebirth
    description: List the rebirth tiers.
permissions:
  rankup.*:
    children:
      rankup.rankup: true
      rankup.admin: true
      rankup.ranks: true
      rankup.prestige: true
      rankup.prestiges: true
      rankup.auto: true
      rankup.maxrankup: true
      rankup.rebirth: true
      rankup.noconfirm: true
      rankup.top: true
  rankup.admin:
    children:
      # if a player can see if the plugin needs updating when they run /aru
      rankup.checkversion: true
      # if a player can run /aru reload
      rankup.reload: true
      # if a player can force rankup or prestige someone
      rankup.force: true
      # if a player receives notifications to update when they log in.
      rankup.notify: true
      rankup.playtime: true
      rankup.noconfirm.other: true
    default: op
  rankup.rankup:
    default: true
  rankup.ranks:
    default: true
  rankup.prestige:
    default: true
  rankup.prestiges:
    default: true
  rankup.auto:
    default: true
  rankup.maxrankup:
    default: true
  rankup.rebirth:
    default: true
  rankup.noconfirm:
    default: true
  rankup.top:
    default: true
  rankup.playtime:
    description: Use all /arkonasranks playtime subcommands for anyone.
    children:
      rankup.playtime.get: true
    default: op
  rankup.playtime.get:
    description: Use /arkonasranks playtime get for anyone.
    default: op
