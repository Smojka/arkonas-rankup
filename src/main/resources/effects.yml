# ArkonasRanks celebration effects.
# Played when a player ranks up or prestiges (also via /maxrankup, autorankup and forced rankups).
#
# Per-rank overrides: add a "celebration:" section to a rank in rankups.yml
# (or a prestige in prestiges.yml) with the same keys as the rankup:/prestige:
# sections below. Any key present in the override replaces the global value.
#
# Message placeholders: %player%, %rank% (old rank), %next% (new rank).
# Messages support legacy & codes, &#RRGGBB hex and MiniMessage tags.
enabled: true

rankup:
  sound:
    name: entity.player.levelup
    volume: 1.0
    pitch: 1.0
  # short ascending note-block "jingle" played on rankup (opt-in). Pitch is
  # clamped to the musical note-block range 0.5-2.0.
  jingle:
    enabled: false
    sound: block.note_block.pling
    notes: 5
    start-pitch: 0.8
    pitch-step: 0.15
    interval-ticks: 3
    volume: 1.0
  particle:
    type: TOTEM_OF_UNDYING
    count: 40
    offset: 0.5
  firework:
    enabled: false
    power: 1
    # firework star colors, hex RRGGBB
    colors: [ '00FF88', '00CCFF' ]
    type: BALL_LARGE
  title:
    title: '&6&lRANKUP!'
    subtitle: '&e%rank% &7» &a%next%'
    fade-in: 10
    stay: 60
    fade-out: 20
  actionbar: ''
  bossbar:
    enabled: false
    text: '&a%player% is now %next%!'
    color: GREEN
    overlay: PROGRESS
    seconds: 5
  # who additionally sees the title/bossbar celebration: none | world | server
  broadcast-mode: none

prestige:
  sound:
    name: ui.toast.challenge_complete
    volume: 1.0
    pitch: 1.0
  particle:
    type: FIREWORK
    count: 60
    offset: 0.7
  firework:
    enabled: true
    power: 1
    colors: [ 'FFD700', 'FF4500' ]
    type: STAR
  title:
    title: '&d&lPRESTIGE!'
    subtitle: '&e%player% &7reached &d%next%'
    fade-in: 10
    stay: 80
    fade-out: 20
  actionbar: ''
  bossbar:
    enabled: false
    text: '&d%player% prestiged to %next%!'
    color: PURPLE
    overlay: PROGRESS
    seconds: 6
  broadcast-mode: none

# Celebration for a rebirth (%next% is the new rebirth group). Its own stinger, distinct
# from rankup/prestige. Fires from the rebirth command / auto-rebirth.
rebirth:
  sound:
    name: ui.toast.challenge_complete
    volume: 1.0
    pitch: 0.8
  jingle:
    enabled: true
    sound: block.note_block.chime
    notes: 6
    start-pitch: 0.7
    pitch-step: 0.18
    interval-ticks: 3
  particle:
    type: TOTEM_OF_UNDYING
    count: 80
    offset: 0.8
  firework:
    enabled: true
    power: 2
    colors: [ 'FF00FF', 'FFD700', '00FFFF' ]
    type: BURST
  title:
    title: '&5&lREBIRTH!'
    subtitle: '&e%player% &7was reborn as &5%next%'
    fade-in: 10
    stay: 90
    fade-out: 20
  actionbar: ''
  bossbar:
    enabled: false
    text: '&5%player% was reborn!'
    color: PURPLE
    overlay: PROGRESS
    seconds: 6
  broadcast-mode: none
