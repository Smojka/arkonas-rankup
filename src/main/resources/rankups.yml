#
# If you are adding your own ranks, make sure to delete the example ranks!
# Need help setting the plugin up? Read the README.
#

# this name doesn't matter
Aexample:
  # the name of the group
  # players have to be in this rank to rankup
  rank: 'A'
  # the name of the rank a player can rankup to
  next: 'B'
  # List of requirements to go to the next rank
  # This example will charge 1000 money to rankup from A to B.
  # the full list of requirement types is in the README
  # custom requirements can also be added by other plugins.
  requirements:
    - 'money 1000'
  # the console will run these commands when a player ranks up
  # nb: groups are automatically changed with vault
  #commands:
  # this will run when a player ranks up from A to B.
  #- 'say {{player}} well done for ranking up from {{rank.rank}} to {{next.rank}}!'
  #
  # OPTIONAL hand-written lore for this rank's menu items. Write it yourself
  # instead of letting the plugin generate the requirement list.
  #   {requirements}  the generated requirement lines, put wherever you want them
  #   {rewards}       the rewards block (confirmation panel only)
  # & codes, &#RRGGBB hex, MiniMessage, {{rank.rank}}/{{next.rank}} and
  # PlaceholderAPI all work. Declaring lore REPLACES the generated lore on that
  # item, so add {requirements} back if you still want the costs shown.
  # An empty entry ('') stays as a blank spacer line, first and last included,
  # so you can pad the tooltip above and below.
  #lore:
  #- ''
  #- '&e&lREQUIREMENTS'
  #- '{requirements}'
  #- ''
  #- '&7Unlocks the &f{{next.rank}} &7mine'
  #- ''
  #
  # Optional per-screen overrides of the line above. Each falls back to `lore`.
  #   lore-current   this rank in the rank path (the rank the player is on)
  #   lore-locked    a rank the player has not reached yet
  #   lore-complete  a rank the player has already passed
  #   lore-info      the info panel on the rankup confirmation screen
  #lore-complete:
  #- '&aAlready earned'
Bexample:
  rank: 'B'
  next: 'C'
  requirements:
    - 'money 2500'
Cexample:
  rank: 'C'
  next: 'D'
  requirements:
    - 'money 5000'
    - 'xp-level 2'
  # you can have a custom messages for each rank
  # the paths of these messages are the same as in the messages for your locale
  rankup:
    requirements-not-met: '&cYou need 5000 money and 2 levels of XP to rankup to D.'
    list:
      complete: "&7{{rank.rank}} &8\xbb &7{{next.rank}} &e(5000 money, 2 XP levels)"
      current: "&c{{rank.rank}} &e\xbb &c{{next.rank}} &e(5000 money, 2 XP levels)"
      incomplete: "&r{{rank.rank}} &e\xbb &r{{next.rank}} &e(5000 money, 2 XP levels)"